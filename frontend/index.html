<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GoldMarket — a trusted marketplace for gold, jewelry, and luxury investment assets. Shop authenticated jewelry, watches, and premium goods with global delivery."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>GoldMarket - Luxury Gold &amp; Premium Goods</title>

    <!-- ─── Critical preconnects ──────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://stream.mux.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- ─── Google Fonts — display=swap prevents FOUT blocking render ──── -->
    <!-- Using only the weights actually consumed to cut transfer size -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- ─── Hero poster image — preloaded so it paints immediately (LCP) ── -->
    <link rel="preload" as="image" href="/hero.png" fetchpriority="high" />

    <!-- ─── Inline theme script — runs before first paint, zero FOUC ───── -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('goldmarket_theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
