openapi: 3.0.0
info:
  title: BKW E-Commerce API
  description: Enterprise-grade REST API for the BKW E-Commerce Platform.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local development server
tags:
  - name: Auth
    description: Authentication & Authorization
  - name: Users
    description: User Management
  - name: Products
    description: Product Catalog & Inventory
  - name: Cart
    description: Shopping Cart Management
  - name: AI
    description: Generative AI Features
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Email or mobile number
                password:
                  type: string
              required:
                - identifier
                - password
      responses:
        '200':
          description: Logged in successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Set HttpOnly gm_access_token and gm_refresh_token cookies
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Registered successfully
  /csrf-token:
    get:
      tags:
        - Auth
      summary: Get CSRF Token
      responses:
        '200':
          description: Returns CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
